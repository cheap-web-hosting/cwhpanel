# Global nginx hardening, included from /etc/nginx/conf.d/ (http context).
#
# `server_tokens off` was only set in panel.conf, so every hosting vhost
# answered with `Server: nginx/1.20.1` — a free version fingerprint for
# scanners. Most specific server blocks do not override this, so a single
# http-level directive covers panel + hosted sites.
server_tokens off;
