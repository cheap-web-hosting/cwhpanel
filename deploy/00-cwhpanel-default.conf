# cwhpanel catch-all for hosts that have no vhost (unknown SNI / Host).
#
# Rendering: scripts/provision-hostname-tls.php substitutes __CERT__ and
# __KEY__ and installs this file as
#   /etc/nginx/conf.d/00-cwhpanel-default.conf
# only once the hostname certificate exists (a missing cert would make
# `nginx -t` fail and take the panel down on reload).
#
# Why: while panel.conf was the `default_server`, ANY unknown host pointed at
# the IP — an un-certed customer domain, a scanner, a lookalike phishing name —
# was answered with the panel login (and its cookies). Unknown hosts now close
# the connection with 444. Real vhosts are unaffected: panel.conf matches its
# server_name and hosting-<domain>.conf serves HTTP for its own names.

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name cwh-catchall.invalid;

    ssl_certificate __CERT__;
    ssl_certificate_key __KEY__;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;

    server_tokens off;
    return 444;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name cwh-catchall.invalid;

    server_tokens off;
    return 444;
}
