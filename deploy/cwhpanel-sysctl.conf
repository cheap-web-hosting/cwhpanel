# cwhpanel kernel/network hardening — safe on the hosted stack (no service
# lockdown, no IPv6 or forwarding changes). Loaded by turn-up.sh via
# /etc/sysctl.d/99-cwhpanel.conf (manual install: cp this file to
# /etc/sysctl.d/99-cwhpanel.conf && sysctl --system).
#
# Network: drop ICMP broadcast amplification, bogus error responses, martian
# logging, and ICMP/route-redirect manipulation.
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.icmp_ignore_bogus_error_responses = 1
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.rp_filter = 1
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.all.log_martians = 1
#
# Kernel: restrict dmesg/kptr (no unprivileged leak of addresses), keep ASLR
# maxed, disallow unprivileged BPF, and protect hardlinks/symlinks against
# unprivileged creation (classic anti-TOCTOU hardening).
kernel.dmesg_restrict = 1
kernel.kptr_restrict = 2
kernel.randomize_va_space = 2
kernel.unprivileged_bpf_disabled = 1
fs.protected_hardlinks = 1
fs.protected_symlinks = 1
