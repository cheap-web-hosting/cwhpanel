# Drop SHA-1 MACs (hmac-sha1*, umac-64*).
#
# Install: /etc/ssh/sshd_config.d/00-cwhpanel-macs.conf  (turn-up.sh)
#
# The 00- prefix is load-bearing on RHEL/Rocky: sshd_config includes
# sshd_config.d/*.conf at the top, and 50-redhat.conf pulls in
# /etc/crypto-policies/back-ends/opensshserver.config — which itself sets
# MACs WITH hmac-sha1. sshd uses the FIRST value it sees, so an override named
# 60-* (or later) is silently ignored. Sorts before 50- => wins.
#
# Only affects the key-exchange MAC list; cipher/kex hardening stays with the
# system crypto policy.
MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,umac-128-etm@openssh.com,hmac-sha2-512,hmac-sha2-256,umac-128@openssh.com
