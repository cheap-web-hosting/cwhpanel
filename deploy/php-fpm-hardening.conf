# Runtime hardening for the panel PHP-FPM daemon (all pools).
# Read-only system paths; writable only where the pools legitimately write
# (account homes for customer sites, sessions, panel storage/logs, postfix
# spool for mail(), runtime sockets, temp).
#
# Deliberately NOT set:
#  - NoNewPrivileges / RestrictSUIDSGID: postfix's postdrop is setgid
#    postdrop — the mail() submission path (sendmail wrapper → postdrop)
#    depends on that setgid transition and silently breaks under NNP
#    (same rationale as the per-account PHP masters).
#  - ProtectHome: customer pools must write account homes.
#  - seccomp/MemoryDenyWriteExecute: would risk PHP extensions.
[Service]
ProtectSystem=full
ReadWritePaths=/home /var/lib/php /var/spool/postfix /var/log/php-fpm /opt/cwhpanel/storage /tmp /run /var/tmp
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectControlGroups=yes
PrivateTmp=true
