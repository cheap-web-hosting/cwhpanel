# CWH Panel — fail2ban jail for HTTP botnet/scanner probes.
#
# Bans hosts that repeatedly probe scanner signatures (env/git/shell/upload
# paths) against nginx. The filter itself is `cwhpanel-nginx-scanner`
# (see deploy/fail2ban-filter-nginx-scanner.conf).
#
# Install: cp deploy/fail2ban-filter-nginx-scanner.conf \
#            /etc/fail2ban/filter.d/cwhpanel-nginx-scanner.conf
#          cp deploy/cwhpanel-fail2ban-scanner.conf \
#            /etc/fail2ban/jail.d/cwhpanel-scanner.conf
#          && systemctl reload-or-restart fail2ban
#
# Safety: banaction is the panel's own firewalld rich-reject (same rule the
# Firewall page writes), so bans show up on the admin Firewall page and can be
# unblocked there. Ports are limited to 80/443 so an SSH/mail connection from
# the same host is not cut by the ban. Keep findtime/maxretry modest: a real
# human browsing won't hit several probe signatures in ten minutes; bots will.
#
# CRITICAL: the panel + hosted sites are served THROUGH Cloudflare, and probes
# that arrive via a CF edge show up with the edge IP ($remote_addr), not the
# client. Banning an edge would cut EVERY proxied site behind it, so the full
# Cloudflare edge range set (ips-v4 + ips-v6 at cloudflare.com) is listed in
# `ignoreip` and those edges are never banned. Only hosts that hit the origin
# directly (real botnet source IPs, as seen in the scanner traffic) get banned.
# Keep this list current when Cloudflare changes ranges.

[cwhpanel-nginx-scanner]
enabled = true
port = 80,443
protocol = tcp
filter = cwhpanel-nginx-scanner
ignoreip = 127.0.0.1/8 ::1 173.245.48.0/20 103.21.244.0/22 103.22.200.0/22 103.31.4.0/22 141.101.64.0/18 108.162.192.0/18 190.93.240.0/20 188.114.96.0/20 197.234.240.0/22 198.41.128.0/17 162.158.0.0/15 104.16.0.0/13 104.24.0.0/14 172.64.0.0/13 131.0.72.0/22 2400:cb00::/32 2606:4700::/32 2803:f800::/32 2405:b500::/32 2405:8100::/32 2a06:98c0::/29 2c0f:f248::/32
logpath = /var/log/nginx/access.log
          /var/log/nginx/*.access.log
backend = polling
findtime = 600
maxretry = 3
bantime = 3600
