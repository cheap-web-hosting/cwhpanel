# cwhpanel — nginx http-level performance tuning.
# Installed by turn-up.sh to /etc/nginx/conf.d/cwhpanel-perf.conf
# (included inside the http{} block).

# Compression (HTML/CSS/JS/JSON/SVG/XML are the assets we serve).
gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types
    text/plain
    text/css
    text/xml
    application/json
    application/javascript
    application/xml
    application/rss+xml
    image/svg+xml;

# File-descriptor cache: cut stat/open syscalls on hot static assets
# (per-account docroots, panel CSS/JS, roundcube/phpmyadmin static).
open_file_cache max=10000 inactive=120s;
open_file_cache_valid 120s;
open_file_cache_min_uses 2;
open_file_cache_errors on;

# Request/response buffer sizing (hosting + panel + proxy front door).
client_body_buffer_size 128k;
client_header_buffer_size 16k;
large_client_header_buffers 4 32k;

proxy_buffers 8 16k;
proxy_buffer_size 16k;
proxy_busy_buffers_size 32k;

fastcgi_buffers 8 16k;
fastcgi_buffer_size 16k;
fastcgi_busy_buffers_size 32k;

# Timeouts: short client-side, generous upstream (long provisioning ops).
reset_timedout_connection on;
client_body_timeout 30;
client_header_timeout 30;
send_timeout 30;
proxy_connect_timeout 10;
proxy_send_timeout 60;
proxy_read_timeout 60;
fastcgi_send_timeout 60;
fastcgi_read_timeout 60;
