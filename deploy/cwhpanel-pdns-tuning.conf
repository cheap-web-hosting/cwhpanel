# cwhpanel — PowerDNS authoritative performance tuning.
# Installed by turn-up.sh to /etc/pdns/cwhpanel-tuning.conf; turn-up then
# merges any missing KEY=VALUE lines into pdns.conf (PowerDNS has no
# `include` directive — verified live: unknown setting 'include' fatals).

# Authoritative response cache: zones change rarely (provisioning upserts),
# and DNS TTLs already govern downstream caching. 30s bounds staleness
# after a panel write while cutting repeated gmysql lookups for hot names.
query-cache-ttl=30
negquery-cache-ttl=10

# DNSSEC metadata (cryptokeys/NSEC3PARAM) is static per zone; 60s avoids
# re-reading it on every answer.
zone-metadata-cache-ttl=60

# Read-committed avoids InnoDB gap-lock stalls when answering while the
# panel writes records; fail fast instead of hanging on a dead backend.
gmysql-innodb-read-committed=yes
gmysql-timeout=10

# Small thread bump for the 4-vCPU reference box (cheap; helps under
# concurrent query bursts).
receiver-threads=2
