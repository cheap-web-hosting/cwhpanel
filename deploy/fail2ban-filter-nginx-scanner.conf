# Fail2Ban filter: web scanner / botnet probes against the panel + hosted sites.
#
# Matches the front-door nginx `combined`/`main` access-log format:
#   $remote_addr - $remote_user [$time_local] "METHOD /path HTTP/x.y" $status ...
#   e.g. 141.101.76.68 - - [22/Oct/2026:01:04:10 +0000] "GET /.git/config HTTP/1.1" 403 153 "-" "..."
#
# fail2ban's datepattern consumes the bracketed timestamp before failregex
# runs, so the request is matched with a tolerant `.*` prefix (never hard-code
# the date bracket in the regex).
#
# Signatures are the botnet credential/shell/backup probes seen live here:
# dotfile secrets (.env/.git/.gitlab/.github/.svn/.aws/.ssh/...), wpshell +
# generic shell upload backdoors, phpUnit RCE, cgi-bin device config, /proc
# leaks, SQL/backup artifacts.
#
# Install: cp deploy/fail2ban-filter-nginx-scanner.conf \
#            /etc/fail2ban/filter.d/cwhpanel-nginx-scanner.conf

[Definition]
failregex = ^<HOST>.*"(?:GET|POST|HEAD|PUT|DELETE|OPTIONS) [^ ]*?(?:/\.(?:env|git|git-credentials|gitlab|github|svn|hg|aws|ssh|htaccess|htpasswd|gitconfig|gitmodules|npmrc|dockercfg|bashrc|profile|ds_store|well-known/acme-challenge)(?:[/?&#. _-]|$)|/\.config/|/wp-filemanager[0-9]*\.php|/wp-content/(?:plugins|themes|uploads)/[^ "]*\.php|/wp-includes/phpunit/|/phpunit(?:\.php|/|$)|/cgi-bin/|/cgi-sys/[^ "]*\.cgi|/proc/self/(?:environ|cmdline|fd|status)|\$\{?(?:IFS|env|PATH)|/(?:admin|wp-admin|vendor|composer)\.(?:json|lock)(?:$|[/?])|/backup\.(?:zip|tar|tar\.gz|gz|sql)(?:$|[/?])|/(?:shell|cmd|webshell|c99|r57|adminer|phpMyAdmin)[^ "]*\.php|/(?:[a-z0-9_-]+shell)[^ "]*\.php)
        ^<HOST>.*"(?:GET|POST|HEAD) (?:/[^\s]*)?\.(?:env|git|pem|bak|old|tar|sql)(?:[\s?"]|$)

ignoreregex =

datepattern = {^LN-BEG}%%ExY(?P<_sep>[-/.])%%m(?P=_sep)%%d[T ]%%H:%%M:%%S(?:[.,]%%f)?(?:\s*%%z)?
              ^[^\[]*\[({DATE})
              {^LN-BEG}