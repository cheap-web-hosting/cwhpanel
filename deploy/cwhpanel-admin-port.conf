# Admin panel dedicated port (Split panels)
#
# The customer panel + login is served from the public port (APP_URL, default
# 443). The ADMIN panel (/admin, /login) lives on its own TLS port. The
# application enforces the split via config('app.admin_port') (env
# PANEL_ADMIN_PORT, default 8443): on the public port, /admin and /login
# redirect to the admin port; on the admin port, /panel/* redirect back to the
# public port. GET / (guest) shows the customer login.
#
# To expose the port, add the following listens to the panel's TLS server block
# in /etc/nginx/conf.d/panel.conf (next to the existing 443 listens):
#
#   listen 8443 ssl;
#   listen [::]:8443 ssl;
#
# then:
#   nginx -t && systemctl reload nginx
#   firewall-cmd --permanent --add-port=8443/tcp && firewall-cmd --reload
#
# The admin port is direct-origin (not behind Cloudflare, which only fronts
# 80/443). Use it from trusted networks / via your own identity layer, and do
# not rely on the CDN to protect it.
