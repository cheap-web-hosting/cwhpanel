; cwhpanel — opcache sizing (installed by turn-up.sh to every php.d dir).
; Hosting panel + many FPM apps share per-version caches; the 128M default
; fills fast under deployment reloads (rsync + FPM reload).
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
