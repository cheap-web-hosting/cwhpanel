# CWH Panel fail2ban jails: brute-force protection for mail + FTP.
#
# Install: cp deploy/cwhpanel-fail2ban.conf /etc/fail2ban/jail.d/cwhpanel.conf
#          && systemctl reload fail2ban   (turn-up.sh does this on fresh boxes)
#
# Why these three and not more:
# - dovecot (IMAP/POP3/Sieve): also covers Roundcube + panel webmail brute
#   force, since both authenticate against Dovecot over IMAP. A separate
#   roundcube-auth jail is deliberately NOT enabled: Roundcube currently
#   emits no login log (log dir holds only .htaccess), so the jail could
#   never fire — Dovecot sees every attempt instead.
# - postfix-sasl (SMTP AUTH on smtp/465/submission): SASL failures only
#   (mode=auth). The broader [postfix] reject jail is left off to avoid
#   banning senders on ordinary 5xx rejects.
# - vsftpd: FAIL LOGIN lines in /var/log/vsftpd.log.
# sshd stays in /etc/fail2ban/jail.local (stricter: 3 fails / 2h ban).
#
# Safety: loopback is always ignored (panel health checks + webmail hit
# Dovecot from 127.0.0.1 every minute and must never ban the host itself).

[DEFAULT]
ignoreip = 127.0.0.1/8 ::1

[dovecot]
enabled = true
maxretry = 5
bantime = 3600

[postfix-sasl]
enabled = true
maxretry = 5
bantime = 3600

[vsftpd]
enabled = true
maxretry = 5
bantime = 3600
