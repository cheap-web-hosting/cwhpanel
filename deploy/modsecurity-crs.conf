# cwhpanel: OWASP CRS for nginx vhosts (loaded once at http level).
#
# Per-site enforcement stays opt-in per domain: each WAF-enabled vhost sets
# `modsecurity on` + its own /etc/modsecurity/<domain>.conf (SecRuleEngine
# plus any SecRuleRemoveById exclusions). Isolated account workers strip
# the WAF block (see NginxIsolationService::stripWaf) — enforcement lives
# at the front-door proxy, which is the only hop that sees the client.
Include /etc/httpd/modsecurity.d/crs-setup.conf
# EPEL ships the rules under httpd's tree.
Include /etc/httpd/modsecurity.d/activated_rules/*.conf

# Audit logging: one serial log for all vhosts; WafService attributes
# entries to websites by hostname. Rotated by logrotate (nginx wildcard).
SecAuditEngine RelevantOnly
SecAuditLogRelevantStatus "^(?:5|4(?!04))"
SecAuditLogParts ABIJDEFHZ
SecAuditLogType Serial
SecAuditLog /var/log/nginx/modsec_audit
