# OpenDKIM milter configuration for the cwhpanel hosting stack.
# Installed by scripts/turn-up.sh step 4 (Mail). The panel provisions
# per-domain signing keys into /etc/cwhpanel/dkim/<domain>.priv and publishes
# default._domainkey TXT records; the agent op `dkim.signing.sync` maintains
# the KeyTable/SigningTable below when domains are created.
Syslog          yes
UserID          opendkim:opendkim
Mode            sv
Canonicalization relaxed/simple
Socket inet:8891@localhost
PidFile         /run/opendkim/opendkim.pid
KeyTable        refile:/etc/opendkim/hosting-key.table
SigningTable    refile:/etc/opendkim/hosting-signing.table
InternalHosts   /etc/opendkim/hosting-internal-hosts
ExternalIgnoreList /etc/opendkim/hosting-internal-hosts
